[package]
name = "gbuildd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gbuild-core.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
globset = "=0.4.18"
notify = "8.2.0"
rmcp = { version = "1.4", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.31"
tempfile = "3.21.0"
tokio-tungstenite = "0.29.0"
