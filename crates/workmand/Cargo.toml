[package]
name = "workmand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
workman-core.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
dirs = "6.0.0"
globset = "=0.4.18"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
listeners = "0.6.1"
notify = "8.2.0"
rmcp = { version = "1.4", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite = "0.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shell-words = "1.1.1"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25.13"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.31"
tempfile = "3.21.0"
tokio-tungstenite = "0.29.0"
