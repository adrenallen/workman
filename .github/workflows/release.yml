name: Release

on:
  # Emergency build-only fallback. Releases are built and published by scripts/release.sh;
  # tags intentionally trigger no GitHub Actions workflow.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version label for a build-only cache warm on the selected branch
        required: true
        default: v0.1.0

concurrency:
  group: workman-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MACOS_TARGET: aarch64-apple-darwin
  LINUX_TARGET: x86_64-unknown-linux-gnu
  MACOS_ARCHIVE: workman-macos-arm64.zip
  MACOS_LEGACY_ARCHIVE: awm-macos-arm64.tar.gz
  MACOS_LEGACY_DESKTOP: awm-desktop-macos-arm64.zip
  LINUX_ARCHIVE: workman-linux-x86_64.tar.gz
  LINUX_LEGACY_ARCHIVE: awm-linux-x86_64.tar.gz
  LINUX_LEGACY_DESKTOP: awm-desktop-linux-x86_64.AppImage
  LINUX_APPIMAGE: workman-linux-x86_64.AppImage
  LINUX_DEB: workman-linux-x86_64.deb

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: release
        name: Validate tag and version files
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$DISPATCH_TAG"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z release tag; received: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          WORKSPACE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          DESKTOP_VERSION="$(jq -r .version apps/desktop/package.json)"
          TAURI_VERSION="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"

          for candidate in "$WORKSPACE_VERSION" "$DESKTOP_VERSION" "$TAURI_VERSION"; do
            if [[ "$candidate" != "$VERSION" ]]; then
              echo "Release $TAG does not match a version file ($candidate)." >&2
              exit 1
            fi
          done

          if ! grep -qE "^## ${VERSION} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $VERSION." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS arm64
    needs: metadata
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # This immutable action revision is the generated dtolnay/rust-toolchain 1.88.0 branch.
      - name: Install pinned Rust 1.88.0
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          targets: ${{ env.MACOS_TARGET }}

      - name: Restore shared Rust release cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: release-${{ env.MACOS_TARGET }}
          workspaces: . -> target
          cache-targets: true
          cache-on-failure: false
          # Tag refs can read main's cache but cannot share caches with later tags. A manual
          # workflow_dispatch on main is therefore the only path that writes the warm cache.
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build CLI and daemon with the shared dist profile
        run: cargo build --locked --profile dist --target "$MACOS_TARGET" -p workmand -p workman-cli

      - name: Build unsigned desktop application
        working-directory: apps/desktop
        run: npm run tauri -- build --ci --no-sign --config '{"build":{"beforeBuildCommand":""}}' --runner "$GITHUB_WORKSPACE/scripts/tauri-dist-runner.sh" --target "$MACOS_TARGET" --bundles app

      - name: Ad-hoc sign and package macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          PACKAGE_DIR="$RUNNER_TEMP/workman-macos-bundle"
          LEGACY_DIR="$RUNNER_TEMP/awm-macos-v0.1.0"
          BIN_TARGET_DIR="target/$MACOS_TARGET/dist"
          BUNDLE_TARGET_DIR="target/$MACOS_TARGET/release"
          APP="$BUNDLE_TARGET_DIR/bundle/macos/Workman.app"

          test -x "$BIN_TARGET_DIR/wrk"
          test -x "$BIN_TARGET_DIR/workmand"
          test -d "$APP"

          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          rm -rf "$PACKAGE_DIR" "$LEGACY_DIR"
          mkdir -p "$RELEASE_DIR" "$PACKAGE_DIR/bin" "$LEGACY_DIR"
          install -m 755 "$BIN_TARGET_DIR/wrk" "$PACKAGE_DIR/bin/wrk"
          install -m 755 "$BIN_TARGET_DIR/workmand" "$PACKAGE_DIR/bin/workmand"
          install -m 755 scripts/release-assets/install.sh "$PACKAGE_DIR/install.sh"
          install -m 644 scripts/release-assets/GETTING-STARTED-macos.md "$PACKAGE_DIR/GETTING-STARTED.md"
          ditto "$APP" "$PACKAGE_DIR/Workman.app"
          (
            cd "$PACKAGE_DIR"
            COPYFILE_DISABLE=1 zip -qry --symlinks "$RELEASE_DIR/$MACOS_ARCHIVE" .
          )
          cp "$RELEASE_DIR/$MACOS_ARCHIVE" "$RELEASE_DIR/$MACOS_LEGACY_DESKTOP"

          install -m 755 "$BIN_TARGET_DIR/wrk" "$LEGACY_DIR/awm"
          install -m 755 "$BIN_TARGET_DIR/workmand" "$LEGACY_DIR/awmd"
          tar -C "$LEGACY_DIR" -czf "$RELEASE_DIR/$MACOS_LEGACY_ARCHIVE" awm awmd

          unzip -l "$RELEASE_DIR/$MACOS_ARCHIVE"
          tar -tzf "$RELEASE_DIR/$MACOS_LEGACY_ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: workman-release-macos-arm64
          path: |
            release/${{ env.MACOS_ARCHIVE }}
            release/${{ env.MACOS_LEGACY_ARCHIVE }}
            release/${{ env.MACOS_LEGACY_DESKTOP }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  linux:
    name: Build Linux x86_64 (experimental)
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # This immutable action revision is the generated dtolnay/rust-toolchain 1.88.0 branch.
      - name: Install pinned Rust 1.88.0
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          targets: ${{ env.LINUX_TARGET }}

      - name: Restore shared Rust release cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: release-${{ env.LINUX_TARGET }}
          workspaces: . -> target
          cache-targets: true
          cache-on-failure: false
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build CLI and daemon with the shared dist profile
        run: cargo build --locked --profile dist --target "$LINUX_TARGET" -p workmand -p workman-cli

      - name: Build experimental desktop bundles
        working-directory: apps/desktop
        run: npm run tauri -- build --ci --config '{"build":{"beforeBuildCommand":""}}' --runner "$GITHUB_WORKSPACE/scripts/tauri-dist-runner.sh" --target "$LINUX_TARGET" --bundles appimage,deb

      - name: Package Linux artifacts with stable names
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          PACKAGE_DIR="$RUNNER_TEMP/workman-linux-bundle"
          LEGACY_DIR="$RUNNER_TEMP/awm-linux-v0.1.0"
          BIN_TARGET_DIR="target/$LINUX_TARGET/dist"
          BUNDLE_DIR="target/$LINUX_TARGET/release/bundle"
          APPIMAGE="$(find "$BUNDLE_DIR/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          DEB="$(find "$BUNDLE_DIR/deb" -type f -name '*.deb' -print -quit)"

          test -x "$BIN_TARGET_DIR/wrk"
          test -x "$BIN_TARGET_DIR/workmand"
          test -n "$APPIMAGE"
          test -n "$DEB"

          rm -rf "$PACKAGE_DIR" "$LEGACY_DIR"
          mkdir -p "$RELEASE_DIR" "$PACKAGE_DIR/bin" "$LEGACY_DIR"
          install -m 755 "$BIN_TARGET_DIR/wrk" "$PACKAGE_DIR/bin/wrk"
          install -m 755 "$BIN_TARGET_DIR/workmand" "$PACKAGE_DIR/bin/workmand"
          install -m 755 "$APPIMAGE" "$PACKAGE_DIR/Workman.AppImage"
          install -m 755 scripts/release-assets/install.sh "$PACKAGE_DIR/install.sh"
          install -m 644 scripts/release-assets/GETTING-STARTED-linux.md "$PACKAGE_DIR/GETTING-STARTED.md"
          tar -C "$PACKAGE_DIR" -czf "$RELEASE_DIR/$LINUX_ARCHIVE" \
            GETTING-STARTED.md install.sh bin Workman.AppImage
          install -m 755 "$APPIMAGE" "$RELEASE_DIR/$LINUX_APPIMAGE"
          install -m 755 "$APPIMAGE" "$RELEASE_DIR/$LINUX_LEGACY_DESKTOP"
          install -m 644 "$DEB" "$RELEASE_DIR/$LINUX_DEB"

          install -m 755 "$BIN_TARGET_DIR/wrk" "$LEGACY_DIR/awm"
          install -m 755 "$BIN_TARGET_DIR/workmand" "$LEGACY_DIR/awmd"
          tar -C "$LEGACY_DIR" -czf "$RELEASE_DIR/$LINUX_LEGACY_ARCHIVE" awm awmd

          tar -tzf "$RELEASE_DIR/$LINUX_ARCHIVE"
          tar -tzf "$RELEASE_DIR/$LINUX_LEGACY_ARCHIVE"
          file "$RELEASE_DIR/$LINUX_APPIMAGE"
          dpkg-deb --info "$RELEASE_DIR/$LINUX_DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: workman-release-linux-x86_64
          path: |
            release/${{ env.LINUX_ARCHIVE }}
            release/${{ env.LINUX_LEGACY_ARCHIVE }}
            release/${{ env.LINUX_LEGACY_DESKTOP }}
            release/${{ env.LINUX_APPIMAGE }}
            release/${{ env.LINUX_DEB }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Assemble emergency build candidate
    needs: [metadata, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: workman-release-*
          path: release
          merge-multiple: true

      - name: Generate checksums and CHANGELOG-derived notes
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ASSETS=(
            "$MACOS_ARCHIVE"
            "$MACOS_LEGACY_ARCHIVE"
            "$MACOS_LEGACY_DESKTOP"
            "$LINUX_ARCHIVE"
            "$LINUX_LEGACY_ARCHIVE"
            "$LINUX_LEGACY_DESKTOP"
            "$LINUX_APPIMAGE"
            "$LINUX_DEB"
          )
          for asset in "${ASSETS[@]}"; do
            test -f "release/$asset"
          done

          pushd release >/dev/null
          sha256sum "${ASSETS[@]}" > SHA256SUMS
          popd >/dev/null

          awk -v version="$VERSION" '
            $0 ~ "^## " version " - " { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog-section.md"

          cat > release/release-notes.md <<EOF
          # Workman $RELEASE_TAG

          ## Install

          ```sh
          git clone --branch "$RELEASE_TAG" --depth 1 https://github.com/adrenallen/workman.git && cd workman && ./install.sh
          ```

          ## macOS arm64

          The desktop app is ad-hoc signed, but it is not Developer ID signed or notarized yet.
          After unzipping, first try Control-clicking **Workman.app** and choosing **Open**. If macOS
          still quarantines the app, run:

          \`\`\`sh
          xattr -dr com.apple.quarantine /Applications/Workman.app
          \`\`\`

          The unified archive contains \`bin/wrk\`, \`bin/workmand\`, and \`Workman.app\` for
          \`aarch64-apple-darwin\`.

          ## Linux x86_64 — EXPERIMENTAL

          Linux packages are provided as an AppImage, a Debian package, and a CLI/daemon archive.
          WebKitGTK rendering has not received end-to-end release testing yet.

          The \`awm-*.tar.gz\` and \`awm-desktop-*\` files are one-release compatibility assets
          for published v0.1.0 updaters. New installations must use the \`workman-*\` assets.

          ## Changes

          EOF
          cat "$RUNNER_TEMP/changelog-section.md" >> release/release-notes.md

          cat release/SHA256SUMS
          cat release/release-notes.md

      - name: Preserve assembled dry-run candidate
        uses: actions/upload-artifact@v4
        with:
          name: workman-release-candidate-${{ needs.metadata.outputs.tag }}
          path: |
            release/${{ env.MACOS_ARCHIVE }}
            release/${{ env.MACOS_LEGACY_ARCHIVE }}
            release/${{ env.MACOS_LEGACY_DESKTOP }}
            release/${{ env.LINUX_ARCHIVE }}
            release/${{ env.LINUX_LEGACY_ARCHIVE }}
            release/${{ env.LINUX_LEGACY_DESKTOP }}
            release/${{ env.LINUX_APPIMAGE }}
            release/${{ env.LINUX_DEB }}
            release/SHA256SUMS
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
