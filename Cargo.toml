[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/workman-core",
    "crates/workmand",
    "crates/workman-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
workman-core = { path = "crates/workman-core" }

# Shipping builds use a separate, cache-friendly profile without changing local --release builds.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = true
