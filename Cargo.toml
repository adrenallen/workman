[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/awm-core",
    "crates/awmd",
    "crates/awm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
awm-core = { path = "crates/awm-core" }

# Shipping builds use a separate, cache-friendly profile without changing local --release builds.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = true
