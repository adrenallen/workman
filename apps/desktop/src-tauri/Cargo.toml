[package]
name = "workman-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "workman_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
futures-util = "0.3.31"
workmand = { path = "../../../crates/workmand" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-notification = "2.3.3"
notify-rust = { version = "4.18.0", features = ["preview-macos-un"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
plist = "1.8.0"

[dev-dependencies]
tempfile = "3.21.0"
