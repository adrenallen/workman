[package]
name = "workman-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "workman_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
workmand = { path = "../../../crates/workmand" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
notify-rust = { version = "4.18.0", features = ["preview-macos-un"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
url = "2.5.8"

# Recorded feedback shares one capture pipeline: cpal for the microphone, xcap
# for displays, and whisper-rs for local transcription. Only the window layer
# and the screen-capture permission model differ per platform.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
cpal = "0.18.2"
hound = "3.5.1"
imageproc = { version = "0.25.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["v4"] }
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent", "NSPasteboard"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"] }
plist = "1.8.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
# Metal is macOS-only; Windows transcribes on the CPU build of whisper.cpp.
whisper-rs = "0.16.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.21.0"
